name: sme310
channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  # Core/runtime & infra (conda)
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - uvicorn
  - uvicorn-standard
  - fastapi
  - starlette
  - httpx
  - anyio
  - h11
  - httpcore
  - aiohttp
  - aiosignal
  - yarl
  - attrs
  - charset-normalizer
  - idna
  - urllib3
  - certifi
  - click
  - colorama
  - jinja2
  - markupsafe
  - python-dateutil
  - pytz
  - tzdata
  - pyarrow
  - pillow
  - requests
  - filelock
  - fsspec
  - cachetools
  - greenlet
  - networkx
  - sympy
  - sqlalchemy
  - orjson
  - regex
  - jsonschema
  - jsonschema-specifications
  - referencing
  - rpds-py
  - pluggy
  - iniconfig
  - pytest
  - watchdog
  - watchfiles
  - altair
  - pygments
  - tornado
  - typing_extensions
  - protobuf
  - gitdb
  - gitpython
  - smmap
  - pydeck
  - mlflow
  - setuptools
  - wheel
  - tqdm

  # Web server / IO extras
  - gunicorn
  - uvloop
  - httptools
  - websockets
  - websocket-client
  - email-validator
  - python-multipart
  - flask
  - werkzeug
  - docker-py

  # Visualization / plotting stack
  - matplotlib
  - contourpy
  - kiwisolver
  - fonttools

  # Security/SSH
  - bcrypt
  - pyopenssl
  - pynacl
  - paramiko

  # GraphQL items
  - graphene
  - graphql-core
  - graphql-relay

  # Let pip handle all Python-specific packages to avoid conflicts
  - pip:
      - -r requirements-lock.txt