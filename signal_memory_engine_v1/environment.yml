name: sme310
channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  # Core/runtime & infra (conda)
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - pytorch=2.2.2
  - uvicorn=0.35.0
  - uvicorn-standard=0.35.0
  - fastapi=0.116.2
  - starlette
  - httpx=0.28.1
  - anyio
  - h11
  - httpcore=1.0.9
  - aiohttp=3.12.15
  - aiosignal=1.4.0
  - yarl
  - attrs
  - charset-normalizer
  - idna
  - urllib3=2.5.0
  - certifi
  - click=8.3.0
  - colorama
  - jinja2
  - markupsafe
  - python-dateutil
  - pytz
  - tzdata
  - pyarrow
  - pillow
  - requests=2.32.5
  - filelock
  - fsspec
  - cachetools
  - greenlet
  - networkx
  - sympy
  - sqlalchemy=2.0.44
  - orjson
  - regex
  - jsonschema
  - jsonschema-specifications
  - referencing
  - rpds-py
  - pluggy
  - iniconfig
  - pytest
  - watchdog
  - watchfiles
  - altair
  - pygments
  - tornado
  - typing_extensions
  - protobuf>=4.25,<5.29
  - gitdb
  - gitpython
  - smmap
  - pydeck
  - mlflow=3.5.1
  - setuptools
  - wheel
  - tqdm

  # Web server / IO extras
  - gunicorn=23.0.0
  - uvloop
  - httptools
  - websockets=15.0.1
  - websocket-client=1.8.0
  - email-validator=2.3.0
  - python-multipart
  - flask=3.1.2
  - werkzeug=3.1.3
  - docker-py=7.1.0

  # Visualization / plotting stack
  - matplotlib=3.10.6
  - contourpy
  - kiwisolver
  - fonttools

  # Security/SSH
  - bcrypt
  - pyopenssl
  - pynacl
  - paramiko

  # GraphQL items
  - graphene=3.4.3
  - graphql-core=3.2.6
  - graphql-relay=3.2.0

  # Let pip handle all Python-specific packages to avoid conflicts
  - pip:
      - -r requirements-lock.txt